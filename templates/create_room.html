<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Sala</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <h1>Crear Sala</h1>
        
        <form id="create-room-form">
            <div class="form-group">
                <label for="room-name">Nombre de la sala:</label>
                <input type="text" id="room-name" name="room-name" required 
                       placeholder="Ej: LobosNocturnos">
            </div>
            
            <div class="form-group">
                <label for="username">Tu nombre:</label>
                <input type="text" id="username" name="username" required 
                       placeholder="Ej: Samuel De Luque">
            </div>
            
            <button type="submit" class="btn btn-primary">Crear Sala</button>
        </form>
        
        <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Volver a Inicio</a>
        
        <div id="connection-status" class="status">
            Conectando...
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('create-room-form');
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const roomName = document.getElementById('room-name').value;
                const username = document.getElementById('username').value;
                
                if (roomName && username) {
                    window.unoClient.createRoom(roomName, username);
                }
            });
        });
    </script>
</body>
</html>
