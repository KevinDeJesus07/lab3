<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala {{ room_code }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <h1>Sala: {{ room_code }}</h1>
        <p>Esta es la sala de juego.</p>
        <p>Jugadores conectados: <span id="player-count">0</span></p>
        
        <div id="game-area">
            <p>El juego comenzará pronto...</p>
        </div>
        
        <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Salir de la Sala</a>
        
        <div id="connection-status" class="status">
            Conectando...
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
