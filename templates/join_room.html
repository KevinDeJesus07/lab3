<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO - Unirse a Sala</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="page-container">
        <main class="form-page">
            <header class="form-page__header">
                <h1 class="form-page__title">Unirse a Sala</h1>
                <p class="form-page__subtitle">Ingresa el código de la sala</p>
            </header>
            
            <form id="join-room-form" class="form" novalidate>
                <div class="form__group">
                    <label for="room-code" class="form__label">
                        Código de la sala
                    </label>
                    <input 
                        type="text" 
                        id="room-code" 
                        name="room-code" 
                        class="form__input form__input--code"
                        placeholder="ABC123"
                        required
                        maxlength="6"
                        pattern="[A-Z0-9]{6}"
                        autocomplete="off">
                    <span class="form__helper">6 caracteres (letras y números)</span>
                </div>
                
                <div class="form__group">
                    <label for="username" class="form__label">
                        Tu nombre
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form__input"
                        placeholder="Ej: David"
                        required
                        maxlength="20"
                        autocomplete="off">
                    <span class="form__helper">Cómo te verán los demás jugadores</span>
                </div>
                
                <div class="form__actions">
                    <button type="submit" class="btn btn--primary btn--large">
                        Unirse a Sala
                    </button>
                </div>
            </form>
            
            <nav class="form-page__nav">
                <a href="{{ url_for('main.index') }}" class="btn btn--secondary">
                    ← Volver al Inicio
                </a>
            </nav>
            
            <footer class="form-page__footer">
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <div id="connection-status" class="connection-status connection-status--connecting">
                    <span class="connection-status__icon">⚡</span>
                    <span class="connection-status__text">Conectando...</span>
                </div>
                <button id="mute-btn" class="btn btn--sound" onclick="toggleMute()">
                    🔈 Sonido
                </button>
                </div>
            </footer>
        </main>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script type="module">
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('join-room-form');
            const roomCodeInput = document.getElementById('room-code');
            const usernameInput = document.getElementById('username');
            
            // Auto-uppercase para el código de sala
            roomCodeInput.addEventListener('input', function(e) {
                this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            });
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const roomCode = roomCodeInput.value.trim();
                const username = usernameInput.value.trim();
                
                if (!roomCode || roomCode.length !== 6) {
                    alert('El código de sala debe tener 6 caracteres');
                    return;
                }
                
                if (!username) {
                    alert('Por favor ingresa tu nombre');
                    return;
                }
                
                // Usar la API global
                window.unoApp.joinRoom(roomCode, username);
            });
        });
    </script>
    <script src="{{ url_for('static', filename='js/sounds.js') }}"></script>
</body>
</html>
